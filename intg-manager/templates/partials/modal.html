<!-- Reusable Modal Component -->
<!-- Usage: Include this partial in your base template, then trigger it via JavaScript or HTMX -->
<div id="modal-overlay" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 transition-opacity duration-300" 
     onclick="closeModal(event)">
    <div class="fixed inset-0 flex items-center justify-center p-4">
        <div id="modal-container" 
             class="bg-uc-light-card dark:bg-uc-card border border-uc-light-border dark:border-uc-border rounded-xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden transform transition-all duration-300 scale-95 opacity-0"
             onclick="event.stopPropagation()">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-uc-border">
                <h2 id="modal-title" class="text-xl font-semibold text-gray-900 dark:text-white">Modal Title</h2>
                <button 
                    onclick="closeModal()"
                    class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-uc-darker"
                    aria-label="Close modal">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <!-- Modal Content (Dynamic) -->
            <div id="modal-content" class="px-6 py-4 overflow-y-auto max-h-[calc(90vh-8rem)]">
                <!-- Content will be loaded here dynamically -->
                <div class="flex items-center justify-center py-12">
                    <svg class="animate-spin h-8 w-8 text-uc-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>
            </div>
            
            <!-- Modal Footer (Optional) -->
            <div id="modal-footer" class="hidden px-6 py-4 border-t border-uc-light-border dark:border-uc-border bg-gray-50 dark:bg-uc-darker/50">
                <!-- Footer content can be added dynamically if needed -->
            </div>
        </div>
    </div>
</div>
