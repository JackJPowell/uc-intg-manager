{% extends "base.html" %}

{% block title %}Your Integrations{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Page Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 sm:gap-0">
        <div>
            <h2 class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-white">Your Integrations</h2>
            <p class="mt-1 text-sm sm:text-base text-gray-600 dark:text-gray-400">
                Manage your custom integrations
            </p>
        </div>
        <button 
            class="inline-flex items-center justify-center px-3 sm:px-4 py-2 bg-uc-primary hover:bg-uc-secondary text-white text-sm font-medium rounded-lg transition-colors"
            hx-post="/api/integrations/refresh-versions"
            hx-swap="none"
            hx-on::after-request="if(event.detail.successful) { htmx.ajax('GET', '/api/integrations/list', {target: '#integrations-container', swap: 'innerHTML'}); }"
            title="Refresh list and check for updates">
            <i id="refresh-icon" class="fa-solid fa-arrows-rotate h-4 w-4 mr-2"></i>
            Refresh
        </button>
    </div>

    <!-- Filter/Search Bar -->
    <div class="bg-uc-light-card dark:bg-uc-card rounded-xl p-4 border border-uc-light-border dark:border-uc-border">
        <div class="flex flex-col sm:flex-row gap-4">
            <div class="flex-1">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-gray-400"></i>
                    <input 
                        type="text" 
                        id="intg-search"
                        placeholder="Search integrations..." 
                        oninput="filterInstalledIntegrations()"
                        class="w-full pl-10 pr-4 py-2 bg-white dark:bg-uc-darker border border-gray-300 dark:border-uc-border rounded-lg text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-uc-primary focus:border-transparent">
                </div>
            </div>
            <div class="flex flex-col sm:flex-row gap-2">
                <select id="intg-status-filter" onchange="filterInstalledIntegrations()" class="px-3 sm:px-4 py-2 bg-white dark:bg-uc-darker border border-gray-300 dark:border-uc-border rounded-lg text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-uc-primary">
                    <option value="all">All Status</option>
                    <option value="updates">Updates Available</option>
                    <option value="needs-config">Needs Configuration</option>
                    <option value="connected">Connected</option>
                    <option value="disconnected">Disconnected</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Integrations List -->
    <div id="integrations-container"
         hx-get="/api/integrations/list"
         hx-trigger="load"
         hx-swap="innerHTML">
        <div class="flex items-center justify-center py-16">
            <div class="spinner"></div>
            <span class="ml-3 text-gray-400">Loading integrations...</span>
        </div>
    </div>
</div>
{% endblock %}
