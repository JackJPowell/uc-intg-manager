<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Integration Manager{% endblock %} - Unfolded Circle</title>
</head>
<body>
    <div id="page-content" class="max-w-7xl mx-auto px-3 sm:px-6 py-4 sm:py-8" hx-history-elt>
        {% if active_remote_id and not active_remote_online %}
        <div class="mb-4 p-4 rounded-lg border border-amber-400 bg-amber-50 dark:border-yellow-500/50 dark:bg-yellow-500/10 flex items-center gap-3">
            <i class="fa-solid fa-circle-exclamation text-amber-500 dark:text-yellow-400"></i>
            <div class="flex-1 text-sm font-medium text-gray-800 dark:text-yellow-200">
                {% if active_remote_name %}{{ active_remote_name }}{% else %}Remote{% endif %} is offline
            </div>
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
