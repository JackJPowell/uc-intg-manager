[project]
name = "uc-intg-manager"
version = "3.0.0"
description = "Unfolded Circle Integration Manager - Web interface for managing custom integrations"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"

authors = [
    { name = "Jack Powell", email = "jackjpowell@gmail.com" }
]

urls.Homepage = "https://github.com/JackJPowell/uc-intg-manager"
urls.Repository = "https://github.com/JackJPowell/uc-intg-manager"

dependencies = [
    # Core dependencies
    "ucapi==0.7.0",
    "ucapi-framework==1.9.5",
    "pyee>=9.0",
    # Web framework
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    # HTTP client
    "aiohttp>=3.9.0",
    "requests>=2.32.5",
    "packaging>=25.0",
    "markdown>=3.5.0",
    "quart>=0.20.0",
    "hypercorn>=0.18.0",
    "unfurled>=0.3.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "types-requests>=2.32.4.20260107",
]

[tool.mypy]
python_version = "3.11"
# ucapi, ucapi-framework, and unfurled are typed at runtime but do not yet
# advertise PEP 561 metadata. This avoids treating their packaging gap as a
# project defect; mypy continues to check our own code normally.
disable_error_code = ["import-untyped"]
