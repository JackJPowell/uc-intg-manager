# Triggered by version tag creation to build a distribution binary, Docker image, and create a release draft
name: "Build & Draft Release"

# Release jobs must never race to publish the same tag or manually requested
# version.  Do not cancel an active release: a partially published artifact or
# container image is harder to recover from than a queued release.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0, without v prefix)"
        required: true
        type: string

env:
  INTG_NAME: manager
  # Python version to use in the builder image. See https://hub.docker.com/r/unfoldedcircle/r2-pyinstaller for possible versions.
  PYTHON_VER: 3.11.13-0.7.0

permissions:
  contents: read

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-24.04-arm
    #Save version to env output variable to be able to use it in the following release job as a tag
    outputs:
      version: ${{ steps.get-version-and-id.outputs.VERSION }}
      driver_id: ${{ steps.get-version-and-id.outputs.DRIVER_ID }}
      prerelease: ${{ steps.get-version-and-id.outputs.IS_PRERELEASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # History of 200 should be more than enough to calculate commit count since last release tag
          fetch-depth: 200
          persist-credentials: false

      - name: Get version and id
        #Id needed for env output variable
        id: get-version-and-id
        run: |
          # Use manual input version if triggered by workflow_dispatch, otherwise extract from tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DRIVER_ID=$(jq .driver_id -r driver.json)" >> $GITHUB_ENV
          # SemVer prereleases have a hyphenated pre-release identifier, e.g.
          # 2.1.0-beta.1 or 2.1.0-b1. Only stable releases may move :latest.
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          # Save to Github output to later use it in Create Release job
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "DRIVER_ID=$(jq .driver_id -r driver.json)" >> $GITHUB_OUTPUT
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Verify stable driver identity
        run: |
          driver_id="$(jq -r .driver_id driver.json)"
          if [[ "$driver_id" == *"_dev"* ]]; then
            echo "Release driver_id must not contain _dev: $driver_id"
            exit 1
          fi
          if ! grep -Fq "driver_id=\"$driver_id\"" intg-manager/driver.py; then
            echo "driver.json driver_id ($driver_id) does not match intg-manager/driver.py"
            exit 1
          fi

      - name: Verify driver.json version for tag release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          DRIVER_VERSION="$(jq -r .version driver.json)"
          if [ "$VERSION" != "$DRIVER_VERSION" ]; then
            echo "Version in driver.json ($DRIVER_VERSION) does not match release tag ($VERSION)."
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build and validate React UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run typecheck
          npm --prefix ui run build

      - name: Test Python project
        run: uv run --frozen --group dev pytest intg-manager/tests -q

      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements-build.txt

      - name: Build
        run: |
          echo "Starting pyinstaller build"
          docker run --rm --name builder \
            --platform=linux/arm64 \
            --user=$(id -u):$(id -g) \
            -v ${GITHUB_WORKSPACE}:/workspace \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -c \
            "cd /workspace && \
              python -m pip install -r requirements-build.txt && \
              pyinstaller --clean --onedir --name intg-${DRIVER_ID} --collect-all zeroconf \
                --add-data 'intg-${INTG_NAME}/static:static' \
                intg-${INTG_NAME}/driver.py"

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts/bin
          mv dist/intg-${{ env.DRIVER_ID }}/* artifacts/bin
          mv artifacts/bin/intg-${{ env.DRIVER_ID }} artifacts/bin/driver
          cp driver.json artifacts/
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends imagemagick
          convert intg-manager/static/img/intg-manager.png \
            -resize 90x90 -strip artifacts/intg-manager.png
          test "$(identify -format '%wx%h' artifacts/intg-manager.png)" = "90x90"
          test "$(stat --format='%s' artifacts/intg-manager.png)" -lt 16384
          echo "ARTIFACT_NAME=uc-intg-manager-${{ env.VERSION }}-aarch64" >> $GITHUB_ENV

      - name: Create upload artifact archive
        shell: bash
        run: |
          tar czvf ${{ env.ARTIFACT_NAME }}.tar.gz -C ${GITHUB_WORKSPACE}/artifacts .
          ls -lah

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/uc-intg-${{ env.INTG_NAME }}
          tags: |
            type=raw,value=v${{ needs.build.outputs.version }}
            type=raw,value=latest,enable=${{ needs.build.outputs.prerelease != 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [build, docker]
    permissions:
      contents: write

    steps:
      - name: Checkout (for CHANGELOG)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Extract release notes from CHANGELOG
        id: release_notes
        run: |
          # Extract the content of the first versioned section (## v<version> ...)
          notes=$(awk '/^## v[0-9]/{found++; if(found==1){next}} found==1 && /^## /{exit} found==1{print}' CHANGELOG.md | sed '/^[[:space:]]*$/d')
          if [ -z "$notes" ]; then
            notes="No release notes provided."
          fi
          # Write outside the workspace root so it is not wiped by artifact extraction
          mkdir -p /tmp/release
          echo "$notes" > /tmp/release/release_notes.md
          echo "Release notes:"
          cat /tmp/release/release_notes.md

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uc-intg-manager-${{ needs.build.outputs.version }}-aarch64
          path: release-assets

      - name: Create hash file
        run: |
          filename="release-assets/uc-intg-manager-${{ needs.build.outputs.version }}-aarch64.tar.gz"
          sha256sum "$filename" > "${{ needs.build.outputs.driver_id }}.hash"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-assets/*.tar.gz,${{needs.build.outputs.driver_id}}.hash"
          draft: false
          prerelease: ${{ needs.build.outputs.prerelease }}
          bodyFile: /tmp/release/release_notes.md
          artifactErrorsFailBuild: true
          tag: v${{needs.build.outputs.version}}
